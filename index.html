<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorcery Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #0d0b0e;
    --surface: #16121a;
    --surface2: #1e1825;
    --border: #2e2438;
    --accent: #c9a84c;
    --accent2: #8b5cf6;
    --text: #e8e0d0;
    --text-muted: #7a6e82;
    --danger: #e05555;
    --success: #4caf7d;

    --set-alpha: #c9a84c;
    --set-beta: #5b9bd5;
    --set-arthurian: #4caf7d;
    --set-gothic: #9b59b6;
    --set-dragonlord: #e05555;
    --set-promotional: #7a6e82;

    --finish-foil: linear-gradient(135deg, #c9a84c, #e8d5a0, #c9a84c);
    --finish-rainbow: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77, #4d96ff, #c77dff);
    --finish-standard: none;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Pro', Georgia, serif;
    font-size: 16px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
  }
  .app-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .app-subtitle {
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* TABS */
  .tab-bar {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* PANELS */
  .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .panel.active { display: flex; }

  /* ─── SCANNER PANEL ─── */
  #scanner-panel { position: relative; }

  .camera-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    background: #000;
    overflow: hidden;
  }
  #camera-video {
    width: 100%;
    display: block;
    max-height: 42dvh;
    object-fit: cover;
  }
  .camera-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* Card guide frame */
  .card-guide {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 56%;
    aspect-ratio: 2.5/3.5;
    border: 2px solid rgba(201,168,76,0.6);
    border-radius: 6px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  }
  .card-guide::before, .card-guide::after,
  .card-guide-corner-bl, .card-guide-corner-br {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--accent);
    border-style: solid;
  }
  .card-guide::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .card-guide::after  { top: -2px; right: -2px; border-width: 2px 2px 0 0; }
  .card-guide-corner-bl { bottom: -2px; left: -2px; border-width: 0 0 2px 2px; }
  .card-guide-corner-br { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

  .motion-indicator {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.2s;
  }
  .motion-indicator.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .motion-indicator.still  { background: var(--success); box-shadow: 0 0 8px var(--success); }

  .camera-status {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(232,224,208,0.7);
    text-transform: uppercase;
    font-family: 'Cinzel', serif;
  }

  /* Camera start screen */
  .camera-start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 28px;
    min-height: 200px;
    background: var(--surface);
  }
  .camera-start p {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.04em;
  }

  /* Identification area */
  .ident-area {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .ident-step {
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .ident-step.active { display: flex; }

  .step-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* Search */
  .search-wrap { position: relative; }
  .search-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 17px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-muted); font-style: italic; }

  /* Top match buttons */
  .top-matches {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .match-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    width: 100%;
  }
  .match-btn:active { transform: scale(0.98); background: var(--surface); }
  .match-btn.top-match { border-color: rgba(201,168,76,0.4); }
  .match-name {
    font-size: 16px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    flex: 1;
  }
  .match-meta {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
  }
  .match-score {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--accent);
    min-width: 36px;
    text-align: right;
  }

  /* Full list */
  .full-list {
    display: none;
    flex-direction: column;
    gap: 4px;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
  }
  .full-list.visible { display: flex; }
  .list-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .list-item:hover, .list-item:active { background: var(--surface2); }
  .list-item-meta { font-size: 11px; color: var(--text-muted); font-style: italic; }

  .show-all-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    cursor: pointer;
    padding: 4px 0;
    text-transform: uppercase;
    text-align: center;
    width: 100%;
  }

  /* VARIANT STEP */
  .selected-card-name {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .variant-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .variant-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    width: 100%;
    text-align: left;
  }
  .variant-btn:active { transform: scale(0.98); }
  .set-pill {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.12em;
    padding: 3px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    min-width: 72px;
    text-align: center;
    flex-shrink: 0;
  }
  .set-Alpha       { background: rgba(201,168,76,0.15); color: var(--set-alpha); border: 1px solid rgba(201,168,76,0.3); }
  .set-Beta        { background: rgba(91,155,213,0.15); color: var(--set-beta); border: 1px solid rgba(91,155,213,0.3); }
  .set-Arthurian   { background: rgba(76,175,125,0.15); color: var(--set-arthurian); border: 1px solid rgba(76,175,125,0.3); }
  .set-Gothic      { background: rgba(155,89,182,0.15); color: var(--set-gothic); border: 1px solid rgba(155,89,182,0.3); }
  .set-Dragonlord  { background: rgba(224,85,85,0.15); color: var(--set-dragonlord); border: 1px solid rgba(224,85,85,0.3); }
  .set-Promotional { background: rgba(122,110,130,0.15); color: var(--set-promotional); border: 1px solid rgba(122,110,130,0.3); }

  .finish-pill {
    font-size: 11px;
    color: var(--text-muted);
    font-style: italic;
    flex: 1;
  }
  .finish-Foil    { color: #c9a84c; }
  .finish-Rainbow { background: var(--finish-rainbow); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-style: normal; font-weight: 600; }

  .product-label {
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    flex-shrink: 0;
    max-width: 90px;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.12em;
    cursor: pointer;
    padding: 2px 0;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .back-btn::before { content: '←'; }

  /* SUCCESS TOAST */
  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--success);
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    padding: 10px 20px;
    border-radius: 20px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ─── COLLECTION PANEL ─── */
  #collection-panel {
    overflow: hidden;
  }

  .collection-toolbar {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .coll-search {
    flex: 1;
    padding: 8px 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    outline: none;
  }
  .coll-search:focus { border-color: var(--accent); }
  .coll-search::placeholder { color: var(--text-muted); font-style: italic; }

  .export-btn, .clear-btn {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .export-btn { background: rgba(201,168,76,0.1); color: var(--accent); border-color: rgba(201,168,76,0.3); }
  .export-btn:hover { background: rgba(201,168,76,0.2); }
  .clear-btn { background: rgba(224,85,85,0.1); color: var(--danger); border-color: rgba(224,85,85,0.3); }

  .collection-stats {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    font-style: italic;
    flex-shrink: 0;
  }

  .collection-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .collection-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    color: var(--text-muted);
    font-style: italic;
    font-size: 14px;
  }
  .collection-empty-icon { font-size: 36px; opacity: 0.3; }

  .coll-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    transition: background 0.1s;
    position: relative;
  }
  .coll-card:hover { background: var(--surface2); border-color: var(--border); }
  .coll-card + .coll-card { border-top: 1px solid rgba(46,36,56,0.5); }

  .coll-card-info { flex: 1 }
  .coll-card-name {
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .coll-card-detail {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
    font-style: italic;
  }
  .coll-qty {
    font-family: 'Cinzel', serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--accent);
    min-width: 32px;
    text-align: center;
  }
  .coll-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 6px;
    border-radius: 4px;
    transition: color 0.15s;
    opacity: 0;
  }
  .coll-card:hover .coll-delete { opacity: 1; }
  .coll-delete:hover { color: var(--danger); }

  /* Buttons */
  .btn-primary {
    background: linear-gradient(135deg, #c9a84c, #a07830);
    color: #0d0b0e;
    border: none;
    padding: 13px 28px;
    border-radius: 8px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    width: 100%;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

  /* Divider */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Canvas for motion detection (hidden) */
  #motion-canvas { display: none; }
  /* OCR crop canvas (hidden) */
  #ocr-canvas { display: none; }

  /* OCR status bar */
  .ocr-status {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ocr-status.visible { display: flex; }
  .ocr-spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ocr-status-text {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    flex: 1;
  }
  .ocr-raw {
    font-size: 11px;
    color: var(--accent);
    font-style: italic;
    font-family: 'Crimson Pro', serif;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* No-match state */
  .no-match-hint {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    text-align: center;
    padding: 8px 0;
  }
</style>
</head>
<body>

<header class="app-header">
  <div>
    <div class="app-title">Sorcery Scanner</div>
    <div class="app-subtitle">Contested Realm · Collection Tracker</div>
  </div>
</header>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('scanner')">⬡ &nbsp;Scanner</button>
  <button class="tab-btn" onclick="switchTab('collection')">☰ &nbsp;Collection</button>
</nav>

<!-- ── SCANNER TAB ── -->
<div id="scanner-panel" class="panel active">

  <div class="camera-wrap" id="camera-wrap">
    <!-- Before camera starts -->
    <div class="camera-start" id="camera-start">
      <p>Point your camera at a card placed on a white background.<br>The app will detect when a card is placed and prompt you to identify it.</p>
      <button class="btn-primary" style="max-width:200px" onclick="startCamera()">Start Camera</button>
    </div>

    <!-- Live feed (hidden until started) -->
    <video id="camera-video" autoplay playsinline muted style="display:none"></video>
    <canvas id="motion-canvas"></canvas>
    <canvas id="ocr-canvas"></canvas>

    <div class="camera-overlay" id="camera-overlay" style="display:none">
      <div class="card-guide">
        <span class="card-guide-corner-bl"></span>
        <span class="card-guide-corner-br"></span>
      </div>
      <div class="motion-indicator" id="motion-indicator"></div>
      <div class="camera-status" id="camera-status">Waiting for card…</div>
    </div>
  </div>

  <!-- OCR status bar -->
  <div class="ocr-status" id="ocr-status">
    <div class="ocr-spinner"></div>
    <span class="ocr-status-text" id="ocr-status-text">Reading card…</span>
    <span class="ocr-raw" id="ocr-raw"></span>
  </div>

  <!-- Identification area -->
  <div class="ident-area">

    <!-- STEP 1: Search -->
    <div class="ident-step active" id="step-search">
      <span class="step-label">Step 1 — Identify Card</span>
      <div class="search-wrap">
        <input class="search-input" id="search-input" type="text"
               placeholder="Type card name…" autocomplete="off" autocorrect="off"
               oninput="onSearch(this.value)">
      </div>
      <div class="top-matches" id="top-matches"></div>
      <button class="show-all-btn" id="show-all-btn" onclick="toggleFullList()" style="display:none">Show all cards ▾</button>
      <div class="full-list" id="full-list"></div>
    </div>

    <!-- STEP 2: Variants -->
    <div class="ident-step" id="step-variants">
      <button class="back-btn" onclick="backToSearch()">Back to search</button>
      <span class="step-label">Step 2 — Select Variant</span>
      <div class="selected-card-name" id="selected-card-name"></div>
      <div class="variant-grid" id="variant-grid"></div>
    </div>

    <!-- STEP 3: Done -->
    <div class="ident-step" id="step-done">
      <button class="back-btn" onclick="backToSearch()">Scan another card</button>
      <div style="text-align:center; padding: 20px 0; color: var(--success);">
        <div style="font-size:40px">✓</div>
        <div style="font-family:'Cinzel',serif; font-size:14px; margin-top:8px; letter-spacing:0.1em">Card Added</div>
        <div id="done-card-name" style="font-size:13px; color:var(--text-muted); margin-top:4px; font-style:italic"></div>
      </div>
    </div>

  </div>
</div>

<!-- ── COLLECTION TAB ── -->
<div id="collection-panel" class="panel">
  <div class="collection-toolbar">
    <input class="coll-search" id="coll-search" type="text" placeholder="Search collection…"
           oninput="renderCollection(this.value)" autocomplete="off">
    <button class="export-btn" onclick="exportCSV()">CSV</button>
    <button class="clear-btn" onclick="clearCollection()">✕</button>
  </div>
  <div class="collection-stats" id="collection-stats"></div>
  <div class="collection-list" id="collection-list"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════

// ═══════════════════════════════════════════
// FUZZY SEARCH (lightweight, no library)
// ═══════════════════════════════════════════
function fuzzyScore(query, target) {
  const q = query.toLowerCase().trim();
  const t = target.toLowerCase();
  if (!q) return 0;
  if (t === q) return 1.0;
  if (t.startsWith(q)) return 0.95;
  if (t.includes(q)) return 0.85;
  // Word prefix match
  const words = t.split(/\s+/);
  if (words.some(w => w.startsWith(q))) return 0.75;
  // Fuzzy char-by-char
  let qi = 0, score = 0, lastMatch = -1;
  for (let ti = 0; ti < t.length && qi < q.length; ti++) {
    if (t[ti] === q[qi]) {
      score += lastMatch === ti - 1 ? 2 : 1;
      lastMatch = ti;
      qi++;
    }
  }
  if (qi < q.length) return 0;
  return Math.min(0.65, score / (q.length * 2.5));
}

function searchCards(query) {
  if (!query.trim()) return [];
  const results = CARDS
    .map(c => ({ card: c, score: fuzzyScore(query, c.name) }))
    .filter(r => r.score > 0.1)
    .sort((a, b) => b.score - a.score)
    .slice(0, 20);
  return results;
}

// CAMERA + MOTION DETECTION + OCR
// ═══════════════════════════════════════════
let stream = null;
let motionTimer = null;
let prevFrame = null;
let cardPresent = false;
let ocrBusy = false;
let tesseractWorker = null;
let rafId = null;

// Initialise Tesseract worker once
async function initTesseract() {
  tesseractWorker = await Tesseract.createWorker('eng', 1, {
    logger: () => {} // suppress log noise
  });
  await tesseractWorker.setParameters({
    tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz\'- ",
    tessedit_pageseg_mode: '7', // treat as single text line
  });
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('camera-video');
    video.srcObject = stream;
    document.getElementById('camera-start').style.display = 'none';
    video.style.display = 'block';
    document.getElementById('camera-overlay').style.display = 'block';

    // Start Tesseract init in background while camera warms up
    document.getElementById('camera-status').textContent = 'Loading OCR engine…';
    initTesseract().then(() => {
      document.getElementById('camera-status').textContent = 'Ready — place card in frame';
    });

    video.addEventListener('playing', startMotionDetection);
  } catch (e) {
    alert('Camera access denied or unavailable. Please allow camera access and try again.');
  }
}

function startMotionDetection() {
  const video = document.getElementById('camera-video');
  const canvas = document.getElementById('motion-canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  canvas.width = 160;
  canvas.height = 120;

  function tick() {
    // Don't run motion detection while OCR is running or card already identified
    if (ocrBusy || cardPresent) {
      rafId = requestAnimationFrame(tick);
      return;
    }

    ctx.drawImage(video, 0, 0, 160, 120);
    const frame = ctx.getImageData(0, 0, 160, 120);

    if (prevFrame) {
      let diff = 0;
      const d1 = prevFrame.data, d2 = frame.data;
      const step = 8;
      let count = 0;
      for (let i = 0; i < d1.length; i += 4 * step) {
        diff += Math.abs(d1[i] - d2[i]) + Math.abs(d1[i+1] - d2[i+1]) + Math.abs(d1[i+2] - d2[i+2]);
        count++;
      }
      const avgDiff = diff / count;

      const indicator = document.getElementById('motion-indicator');
      const status = document.getElementById('camera-status');

      if (avgDiff > 12) {
        indicator.className = 'motion-indicator active';
        if (motionTimer) { clearTimeout(motionTimer); motionTimer = null; }
        status.textContent = 'Motion detected…';
      } else if (avgDiff > 3) {
        indicator.className = 'motion-indicator';
        if (!motionTimer) {
          motionTimer = setTimeout(() => snapAndOCR(video), 900);
        }
      } else {
        if (!motionTimer) {
          indicator.className = 'motion-indicator';
          if (tesseractWorker) status.textContent = 'Ready — place card in frame';
        }
      }
    }

    prevFrame = frame;
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ── Snap the video frame and run OCR on the title strip ──
async function snapAndOCR(video) {
  motionTimer = null;
  if (ocrBusy || !tesseractWorker) return;

  // Check brightness first — reject if still looks like empty white background
  const motCtx = document.getElementById('motion-canvas').getContext('2d', { willReadFrequently: true });
  motCtx.drawImage(video, 0, 0, 160, 120);
  const center = motCtx.getImageData(40, 30, 80, 60);
  let brightSum = 0, cnt = 0;
  for (let i = 0; i < center.data.length; i += 4) {
    brightSum += center.data[i] * 0.299 + center.data[i+1] * 0.587 + center.data[i+2] * 0.114;
    cnt++;
  }
  if (brightSum / cnt > 215) {
    document.getElementById('camera-status').textContent = 'Ready — place card in frame';
    document.getElementById('motion-indicator').className = 'motion-indicator';
    return;
  }

  ocrBusy = true;
  document.getElementById('motion-indicator').className = 'motion-indicator still';
  document.getElementById('camera-status').textContent = 'Card detected — reading…';

  // ── Draw high-res crop of the card title region to OCR canvas ──
  // Sorcery cards: title is in the top ~13% of the card face.
  // The card guide sits roughly in the centre 56% width of the video.
  const ocrCanvas = document.getElementById('ocr-canvas');
  const ocrCtx = ocrCanvas.getContext('2d');

  const vw = video.videoWidth  || 1280;
  const vh = video.videoHeight || 720;

  // Map guide frame position to video pixel coords
  // Guide is 56% wide, centred, aspect ratio 2.5:3.5
  const guideW = vw * 0.56;
  const guideH = guideW * (3.5 / 2.5);
  const guideX = (vw - guideW) / 2;
  const guideY = (vh - guideH) / 2;

  // Title strip: top 13% of card, inset 5% horizontally
  const stripX = guideX + guideW * 0.05;
  const stripY = guideY + guideH * 0.04;
  const stripW = guideW * 0.90;
  const stripH = guideH * 0.13;

  // Draw at 3× scale for better OCR accuracy
  const scale = 3;
  ocrCanvas.width  = stripW * scale;
  ocrCanvas.height = stripH * scale;

  // Preprocessing: draw, then boost contrast
  ocrCtx.drawImage(video,
    stripX, stripY, stripW, stripH,
    0, 0, ocrCanvas.width, ocrCanvas.height
  );

  // Contrast + grayscale filter for better OCR
  const imgData = ocrCtx.getImageData(0, 0, ocrCanvas.width, ocrCanvas.height);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    // Grayscale
    const gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
    // High contrast: push toward black or white
    const boosted = gray < 128 ? Math.max(0, gray - 40) : Math.min(255, gray + 40);
    d[i] = d[i+1] = d[i+2] = boosted;
  }
  ocrCtx.putImageData(imgData, 0, 0);

  // Show OCR status bar
  const ocrStatusEl = document.getElementById('ocr-status');
  const ocrStatusText = document.getElementById('ocr-status-text');
  const ocrRaw = document.getElementById('ocr-raw');
  ocrStatusEl.classList.add('visible');
  ocrStatusText.textContent = 'Reading card name…';
  ocrRaw.textContent = '';

  try {
    const result = await tesseractWorker.recognize(ocrCanvas);
    const rawText = result.data.text.trim().replace(/[^A-Za-z\'\- ]/g, '').trim();
    ocrRaw.textContent = rawText || '(no text)';

    if (!rawText || rawText.length < 2) {
      ocrStatusText.textContent = 'Could not read — try repositioning';
      showOcrResults([]);
    } else {
      ocrStatusText.textContent = 'Matched against database';
      const matches = searchCards(rawText);
      showOcrResults(matches, rawText);
    }
  } catch (err) {
    ocrStatusText.textContent = 'OCR error — try again';
    showOcrResults([]);
  }

  ocrBusy = false;
  cardPresent = true;
}

// ── Display OCR results as suggestion buttons ──
function showOcrResults(matches, rawText) {
  // Switch to search step and populate
  document.querySelectorAll('.ident-step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-search').classList.add('active');

  const topDiv = document.getElementById('top-matches');
  const showAllBtn = document.getElementById('show-all-btn');
  const fullList = document.getElementById('full-list');
  const searchInput = document.getElementById('search-input');

  // Pre-fill search with OCR text so user can refine
  if (rawText) searchInput.value = rawText;

  const top3 = matches.slice(0, 3);

  if (top3.length === 0) {
    topDiv.innerHTML = '<div class="no-match-hint">No matches found — try typing the card name below</div>';
    showAllBtn.style.display = 'none';
    fullList.classList.remove('visible');
    return;
  }

  topDiv.innerHTML = top3.map((r, i) => {
    const pct = Math.round(r.score * 100);
    const sets = [...new Set(r.card.variants.map(v => v.set))].join(', ');
    return `<button class="match-btn ${i === 0 ? 'top-match' : ''}" onclick="selectCard('${escHtml(r.card.name)}')">
      <div>
        <div class="match-name">${escHtml(r.card.name)}</div>
        <div class="match-meta">${escHtml(r.card.type)} · ${escHtml(r.card.rarity)} · ${escHtml(sets)}</div>
      </div>
      <div class="match-score">${pct}%</div>
    </button>`;
  }).join('');

  if (matches.length > 3) {
    showAllBtn.style.display = 'block';
    showAllBtn.textContent = `Show all ${matches.length} results ▾`;
    // Populate full list
    fullList.innerHTML = matches.map(r => {
      const sets = [...new Set(r.card.variants.map(v => v.set))].join(', ');
      return `<div class="list-item" onclick="selectCard('${escHtml(r.card.name)}')">
        <span>${escHtml(r.card.name)}</span>
        <span class="list-item-meta">${escHtml(r.card.type)} · ${escHtml(sets)}</span>
      </div>`;
    }).join('');
  } else {
    showAllBtn.style.display = 'none';
  }
}

// IDENTIFICATION FLOW

let allCardsShown = false;

function onSearch(query) {
  allCardsShown = false;
  const results = searchCards(query);
  const topDiv = document.getElementById('top-matches');
  const showAllBtn = document.getElementById('show-all-btn');
  const fullList = document.getElementById('full-list');
  fullList.classList.remove('visible');

  if (!query.trim()) {
    topDiv.innerHTML = '';
    showAllBtn.style.display = 'none';
    return;
  }

  // Top 3 as big buttons
  const top3 = results.slice(0, 3);
  topDiv.innerHTML = top3.map((r, i) => {
    const pct = Math.round(r.score * 100);
    const sets = [...new Set(r.card.variants.map(v => v.set))].join(', ');
    return `<button class="match-btn ${i === 0 ? 'top-match' : ''}" onclick="selectCard('${escHtml(r.card.name)}')">
      <div>
        <div class="match-name">${escHtml(r.card.name)}</div>
        <div class="match-meta">${escHtml(r.card.type)} · ${escHtml(r.card.rarity)} · ${escHtml(sets)}</div>
      </div>
      <div class="match-score">${pct}%</div>
    </button>`;
  }).join('');

  // Show all button if there are more
  if (results.length > 3) {
    showAllBtn.style.display = 'block';
    showAllBtn.textContent = `Show all ${results.length} results ▾`;
  } else {
    showAllBtn.style.display = 'none';
  }

  // Populate full list (hidden until toggle)
  fullList.innerHTML = results.map(r => {
    const sets = [...new Set(r.card.variants.map(v => v.set))].join(', ');
    return `<div class="list-item" onclick="selectCard('${escHtml(r.card.name)}')">
      <span>${escHtml(r.card.name)}</span>
      <span class="list-item-meta">${escHtml(r.card.type)} · ${escHtml(sets)}</span>
    </div>`;
  }).join('');
}

function toggleFullList() {
  const fl = document.getElementById('full-list');
  const btn = document.getElementById('show-all-btn');
  allCardsShown = !allCardsShown;
  if (allCardsShown) {
    fl.classList.add('visible');
    btn.textContent = 'Hide list ▴';
  } else {
    fl.classList.remove('visible');
    const results = searchCards(document.getElementById('search-input').value);
    btn.textContent = `Show all ${results.length} results ▾`;
  }
}

function selectCard(name) {
  const card = CARDS.find(c => c.name === name);
  if (!card) return;

  // Show step 2
  document.getElementById('step-search').classList.remove('active');
  document.getElementById('step-variants').classList.add('active');
  document.getElementById('selected-card-name').textContent = name;

  // Build variant buttons
  const grid = document.getElementById('variant-grid');
  grid.innerHTML = card.variants.map(v => {
    const setKey = v.set.replace(/\s+/g, '').replace('ArthurianLegends', 'Arthurian');
    const productLabel = v.product.replace(/_/g, ' ');
    const slugData = encodeURIComponent(JSON.stringify({ name, variant: v }));
    return `<button class="variant-btn" onclick='confirmVariant(${JSON.stringify(name)}, ${JSON.stringify(v)})'>
      <span class="set-pill set-${setKey}">${v.set}</span>
      <span class="finish-pill finish-${v.finish}">${v.finish}</span>
      <span class="product-label">${productLabel}</span>
    </button>`;
  }).join('');
}

function backToSearch() {
  document.querySelectorAll('.ident-step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-search').classList.add('active');
  document.getElementById('search-input').value = '';
  document.getElementById('top-matches').innerHTML = '';
  document.getElementById('show-all-btn').style.display = 'none';
  document.getElementById('full-list').classList.remove('visible');
  document.getElementById('ocr-status').classList.remove('visible');
  cardPresent = false;
  ocrBusy = false;
  prevFrame = null; // force fresh motion baseline
  if (document.getElementById('camera-status'))
    document.getElementById('camera-status').textContent = 'Ready — place card in frame';
}

function confirmVariant(name, variant) {
  // Add to collection
  const col = loadCollection();
  const key = `${name}||${variant.set}||${variant.finish}||${variant.product}`;
  const existing = col.find(e => e.key === key);
  if (existing) {
    existing.qty++;
    existing.lastAdded = new Date().toISOString();
  } else {
    col.push({
      key,
      name,
      set: variant.set,
      finish: variant.finish,
      product: variant.product,
      artist: variant.artist,
      slug: variant.slug,
      qty: 1,
      firstAdded: new Date().toISOString(),
      lastAdded: new Date().toISOString()
    });
  }
  saveCollection(col);

  // Show done step
  document.querySelectorAll('.ident-step').forEach(s => s.classList.remove('active'));
  document.getElementById('step-done').classList.add('active');
  document.getElementById('done-card-name').textContent =
    `${name} · ${variant.set} · ${variant.finish}`;

  showToast('Added to collection');
  cardPresent = false;
}

// ═══════════════════════════════════════════
// COLLECTION VIEW
// ═══════════════════════════════════════════
function renderCollection(filter) {
  const col = loadCollection();
  const statsEl = document.getElementById('collection-stats');
  const listEl = document.getElementById('collection-list');

  const total = col.reduce((s, e) => s + e.qty, 0);
  statsEl.textContent = `${col.length} unique card${col.length !== 1 ? 's' : ''} · ${total} total cop${total !== 1 ? 'ies' : 'y'}`;

  let items = col;
  if (filter) {
    const f = filter.toLowerCase();
    items = col.filter(e =>
      e.name.toLowerCase().includes(f) ||
      e.set.toLowerCase().includes(f) ||
      e.finish.toLowerCase().includes(f)
    );
  }

  if (items.length === 0) {
    listEl.innerHTML = `<div class="collection-empty">
      <div class="collection-empty-icon">⬡</div>
      <div>${col.length === 0 ? 'No cards scanned yet' : 'No matches'}</div>
    </div>`;
    return;
  }

  listEl.innerHTML = items.map(e => {
    const setKey = e.set.replace(/\s+/g, '').replace('ArthurianLegends', 'Arthurian');
    const productLabel = e.product.replace(/_/g, ' ');
    return `<div class="coll-card">
      <div class="coll-card-info">
        <div class="coll-card-name">${escHtml(e.name)}</div>
        <div class="coll-card-detail">
          <span class="set-pill set-${setKey}" style="font-size:8px;padding:2px 6px">${e.set}</span>
          &nbsp;${escHtml(e.finish)} · ${escHtml(productLabel)}
        </div>
      </div>
      <div class="coll-qty">${e.qty}</div>
      <button class="coll-delete" onclick="deleteEntry('${escHtml(e.key)}')">✕</button>
    </div>`;
  }).join('');
}

function deleteEntry(key) {
  if (!confirm('Remove this card from your collection?')) return;
  const col = loadCollection().filter(e => e.key !== key);
  saveCollection(col);
  renderCollection(document.getElementById('coll-search').value);
}

function clearCollection() {
  if (!confirm('Clear your entire collection? This cannot be undone.')) return;
  saveCollection([]);
  renderCollection('');
}

// ═══════════════════════════════════════════
// CSV EXPORT
// ═══════════════════════════════════════════
function exportCSV() {
  const col = loadCollection();
  if (col.length === 0) { showToast('Nothing to export'); return; }
  const header = 'card_name,set,finish,product,artist,slug,quantity,first_added,last_added';
  const rows = col.map(e =>
    [e.name, e.set, e.finish, e.product, e.artist || '', e.slug, e.qty,
     (e.firstAdded || '').slice(0,10), (e.lastAdded || '').slice(0,10)]
    .map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
  );
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sorcery-collection-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSV exported');
}

// ═══════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Init
renderCollection('');
</script>
